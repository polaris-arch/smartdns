name: Upstream protocol verification
on:
  push:
    branches: [verify/upstream-general-corrections]
permissions:
  contents: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: [{"profile": "quic-http3", "sha": "833f2fc7dcb72a13c0f7d9065da6bc3e4355c67b", "sdk": "3.5"}, {"profile": "sanitizers", "sha": "30455a8eb7a88e39ef4176870bc8fd18ce983a0b", "sdk": "3.5"}]
    env:
      PROFILE: ${{ matrix.profile }}
      CANDIDATE: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify native profile
        if: matrix.sdk == 'native'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtest-dev dnsutils libssl-dev zlib1g-dev
          sudo env PROFILE="$PROFILE" CANDIDATE="$CANDIDATE" PROOF="$RUNNER_TEMP/evidence" bash .github/verification/protocols.sh
      - name: Verify OpenSSL QUIC profile
        if: matrix.sdk == '3.5'
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/evidence:/evidence" -w /work -e PROFILE -e CANDIDATE debian:trixie bash -c '
            apt-get update -qq && apt-get install -y build-essential git libssl-dev libgtest-dev dnsutils zlib1g-dev python3 ca-certificates &&
            PROOF=/evidence bash .github/verification/protocols.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocols-${{ matrix.profile }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
