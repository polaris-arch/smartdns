name: Upstream PR closure qualification
on:
  push:
    branches: [verify/upstream-general-corrections]
permissions:
  contents: read
jobs:
  topics:
    if: false # public recipes qualified in 42793518084
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pr: [2489, 2490, 2491, 2492, 2493, 2494, 2495]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qualify independent topic and old-code control
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker pull debian:trixie
          docker image inspect debian:trixie --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/evidence/image.json"
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/evidence:/evidence" -w /work -e PUBLIC_REPRO=1 -e PR=${{ matrix.pr }} -e PROOF=/evidence debian:trixie bash -c '
            apt-get update -qq && apt-get install -y build-essential git libssl-dev libgtest-dev dnsutils zlib1g-dev python3 ca-certificates &&
            bash .github/verification/closure.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-${{ matrix.pr }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
  combined:
    if: false # production unchanged; public recipes qualify independent source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [integration, sanitizers]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qualify combined source with OpenSSL QUIC
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker pull debian:trixie
          docker image inspect debian:trixie --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/evidence/image.json"
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/evidence:/evidence" -w /work -e PROFILE=${{ matrix.profile }} -e PROOF=/evidence debian:trixie bash -c '
            apt-get update -qq && apt-get install -y build-essential git libssl-dev libgtest-dev dnsutils zlib1g-dev python3 ca-certificates &&
            bash .github/verification/closure.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-${{ matrix.profile }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
  ui:
    if: false # unchanged UI/ABI already qualified at 8bf9540
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev libssl-dev libgtest-dev dnsutils zlib1g-dev
          PR=2486 UI_COMBINED=1 PROOF="$RUNNER_TEMP/evidence" bash .github/verification/closure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-ui
          path: ${{ runner.temp }}/evidence
          retention-days: 14
  compat32:
    if: false # this candidate changes only HTTP/2 test scheduling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: i686-unknown-linux-gnu
      - name: Qualify 32-bit native and UI with upstream TLS dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y g++-multilib libclang-dev libssl-dev:amd64 libssl-dev:i386 libgtest-dev:i386 zlib1g-dev:i386 dnsutils
          CC='gcc -m32' CXX='g++ -m32' PROFILE=compat32 PROOF="$RUNNER_TEMP/evidence/native" bash .github/verification/closure.sh
          PR=2486 CFLAGS='-O2 -m32' CARGO_BUILD_TARGET=i686-unknown-linux-gnu BINDGEN_EXTRA_CLANG_ARGS='--target=i686-linux-gnu' I686_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR=/usr/lib/i386-linux-gnu I686_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR=/usr/include PROOF="$RUNNER_TEMP/evidence/ui" bash .github/verification/closure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-compat32
          path: ${{ runner.temp }}/evidence
          retention-days: 14

  abi-reproduction:
    if: false # ABI recipes qualified in 42793518084
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bits: ['64', '32']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.bits == '32' && 'i686-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      - name: Execute public ABI recipe
        env:
          PR: 2495
          ABI_BITS: ${{ matrix.bits }}
          PROOF: ${{ runner.temp }}/evidence
        run: |
          sudo apt-get update -qq
          if [[ $ABI_BITS == 32 ]]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update -qq
            sudo apt-get install -y g++-multilib libclang-dev libssl-dev:amd64 libssl-dev:i386
          else
            sudo apt-get install -y libclang-dev libssl-dev
          fi
          python3 .github/verification/public-reproduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-abi-${{ matrix.bits }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14

  protocol-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare reset-stream compression-state handling
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/evidence:/evidence" -w /work -e PROOF=/evidence debian:trixie bash -c '
            apt-get update -qq && apt-get install -y build-essential git libssl-dev libgtest-dev dnsutils zlib1g-dev python3 ca-certificates &&
            git config --global --add safe.directory /work && python3 .github/verification/http2-diagnose.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-diagnosis
          path: ${{ runner.temp }}/evidence
          retention-days: 14
