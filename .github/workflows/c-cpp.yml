name: C/C++ CI
on:
  workflow_dispatch:
    inputs:
      release_validation:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dns:
    name: Compare runner and Ubuntu dependency-container DNS
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Host and container resolution
        shell: bash
        run: |
          set +e
          printf 'Resolver mode: host\n'
          cat /etc/resolv.conf
          for domain in archive.ubuntu.com security.ubuntu.com deb.debian.org; do
            printf 'Domain: %s\n' "$domain"
            timeout 8 getent ahostsv4 "$domain"
          done
          docker pull ubuntu:24.04
          for mode in default host cloudflare google; do
            printf 'Resolver mode: %s\n' "$mode"
            flags=()
            case "$mode" in
              host) flags=(--network host);;
              cloudflare) flags=(--dns 1.1.1.1);;
              google) flags=(--dns 8.8.8.8);;
            esac
            timeout 35 docker run --rm "${flags[@]}" ubuntu:24.04 bash -c '
              cat /etc/resolv.conf
              cat /etc/nsswitch.conf
              for domain in archive.ubuntu.com security.ubuntu.com deb.debian.org; do
                printf "Domain: %s\n" "$domain"
                timeout 8 getent ahostsv4 "$domain"
              done
              exit 0'
          done
          exit 0
