name: WebUI CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Build/test only: complete native, Rust/REST, pinned WebUI and real OpenWrt SDK; never publish'
        required: false
        default: false
        type: boolean

      sdk_cache_validation:
        description: 'SDK-only cache validation against an accepted exact reference; never repeats ordinary/native builds'
        type: choice
        options: [disabled, cold, warm]
        default: disabled
      reference_run:
        description: 'Exact accepted WebUI reference run ID (required for SDK-only)'
        type: string
        default: ''
      reference_attempt:
        description: 'Exact accepted reference attempt (required for SDK-only)'
        type: string
        default: ''
      reference_head:
        description: 'Full accepted reference commit SHA (required for SDK-only)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.full_validation && (inputs.sdk_cache_validation || 'disabled') == 'disabled' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.99.1'
        rust-src-dir: plugin/smartdns-ui
        cache-workspaces: 'plugin/smartdns-ui -> target'
    - name: test
      run: |
        EXTRA_CFLAGS=-fPIC make -C plugin/smartdns-ui test -j8

  native-full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && (inputs.sdk_cache_validation || 'disabled') == 'disabled' }}
    uses: ./.github/workflows/c-cpp.yml
    with:
      release_validation: true

  plugin-webui-full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && (inputs.sdk_cache_validation || 'disabled') == 'disabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install the SDK-compatible source-lock checker without a premature cache key
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.89.0'
        override: false
        cache: false
    - name: Validate the tracked dependency lock for tests and both package builds
      run: |
        set -euo pipefail
        mkdir -p ci-webui
        cd plugin/smartdns-ui
        test "$(rustc +1.89.0 --version | awk '{print $2}')" = 1.89.0
        rustc +1.89.0 -vV > ../../ci-webui/lock-rustc.txt
        cargo +1.89.0 --version > ../../ci-webui/lock-cargo.txt
        git ls-files --error-unmatch Cargo.lock
        test -s Cargo.lock
        cp Cargo.lock ../../ci-webui/Cargo.lock
        sha256sum Cargo.lock > ../../ci-webui/Cargo.lock.sha256
        # Never resolve or update the source graph in a build. Inspect both
        # actual CI targets, then require real builds on their compilers.
        for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
          cargo +1.89.0 metadata --locked --format-version 1 --filter-platform "$target" > "../../ci-webui/metadata-$target.json"
        done
        python3 - <<'PY'
        import json, pathlib
        for path in pathlib.Path('../../ci-webui').glob('metadata-*.json'):
            data = json.loads(path.read_text())
            selected = {node['id'] for node in data['resolve']['nodes']}
            for package in data['packages']:
                version = package.get('rust_version')
                if package['id'] in selected and version:
                    parts = tuple(int(part) for part in version.split('.'))
                    assert (parts + (0, 0))[:3] <= (1, 89, 0), (path.name, package['id'], version)
        PY
        sha256sum -c ../../ci-webui/Cargo.lock.sha256
    - name: Install test compiler and cache the actual plugin workspace and lock
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: '1.99.1'
        rust-src-dir: plugin/smartdns-ui
        cache-workspaces: 'plugin/smartdns-ui -> target'
    - uses: actions/setup-node@v4
      with:
        node-version: '24.21.0'
    - name: Prepare ordinary build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev zlib1g-dev clang libclang-dev dnsutils curl wget patch
        mkdir -p ci-webui/packages
        git rev-parse HEAD > ci-webui/source-sha.txt
        (cd plugin/smartdns-ui; rustc -vV) > ci-webui/rustc.txt
        node --version > ci-webui/node.txt
    - name: All Rust and real REST tests, including unchanged HTTPS case
      env:
        WITH_ZLIB: 'yes'
        SMARTDNS_SERVICE_API_EVIDENCE: ${{ github.workspace }}/ci-webui/actual-service-api.json
      run: |
        set -euo pipefail
        make -C src WITH_ZLIB=yes EXTRA_CFLAGS=-fPIC libsmartdns-test.a -j2
        (cd plugin/smartdns-ui; sha256sum -c ../../ci-webui/Cargo.lock.sha256)
        (cd plugin/smartdns-ui; rustc +1.89.0 -vV) > ci-webui/check-rustc.txt
        (cd plugin/smartdns-ui; timeout -k 15 1200 cargo +1.89.0 check --locked --tests) 2>&1 | tee ci-webui/rust-msrv-check.log
        (cd plugin/smartdns-ui; sha256sum -c ../../ci-webui/Cargo.lock.sha256)
        (cd plugin/smartdns-ui; timeout -k 15 1200 cargo test --locked -- --test-threads=1) 2>&1 | tee ci-webui/rust-rest.log
        (cd plugin/smartdns-ui; sha256sum -c ../../ci-webui/Cargo.lock.sha256)
        # Native C logs can split libtest's case name from its final status.
        # Execute the exact HTTPS case from the same locked target a second time;
        # require a successful process and one non-ignored result, not arbitrary ok.
        (cd plugin/smartdns-ui; timeout -k 15 120 cargo test --locked --color never --test restapi_test test_rest_api_https_server -- --exact --test-threads=1 --color never) 2>&1 | tee ci-webui/https-exact.log
        test "$(grep -Ec '^running 1 test$' ci-webui/https-exact.log)" -eq 1
        test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' ci-webui/https-exact.log)" -eq 1
        (cd plugin/smartdns-ui; sha256sum -c ../../ci-webui/Cargo.lock.sha256)
        test -s ci-webui/actual-service-api.json
    - name: Build matching daemon/plugin and actual generic WebUI package
      run: |
        set -euo pipefail
        CARGO_BUILD_ARGS=--locked timeout -k 15 1800 sh package/build-pkg.sh --platform linux --arch x86-64 --with-ui --ver "0.0.0-ci-${GITHUB_SHA:0:12}" --outputdir "$PWD/ci-webui/packages" 2>&1 | tee ci-webui/package.log
        (cd plugin/smartdns-ui; sha256sum -c ../../ci-webui/Cargo.lock.sha256)
        . package/webui/source.conf
        sh package/webui/test-prepare-source.sh "package/target/smartdns-webui-$SMARTDNS_WEBUI_COMMIT.tar.gz" 2>&1 | tee ci-webui/prepare.log
        node package/webui/test-table-identity.cjs package/target/smartdns-webui ci-webui/actual-service-api.json ci-webui/table-identity.json
        test -s package/target/smartdns-webui/out/dashboard/upstream-servers.html
        package_file=$(find ci-webui/packages -maxdepth 1 -name '*.tar.gz' -type f)
        test "$(printf '%s\n' "$package_file" | wc -l)" -eq 1
        test -n "$package_file"
        tar -tzf "$package_file" > ci-webui/package-inventory.txt
        grep -F 'smartdns/usr/sbin/smartdns' ci-webui/package-inventory.txt
        grep -F 'smartdns/usr/local/lib/smartdns/smartdns_ui.so' ci-webui/package-inventory.txt
        grep -F 'smartdns/usr/share/smartdns/wwwroot/dashboard/upstream-servers.html' ci-webui/package-inventory.txt
        sha256sum "$package_file" > ci-webui/package.sha256
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: plugin-webui-${{ github.sha }}
        path: ci-webui/
        if-no-files-found: error

  reference-check:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.sdk_cache_validation == 'cold' || inputs.sdk_cache_validation == 'warm') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
    - name: Reject conflicting full and SDK-only modes
      env:
        FULL_VALIDATION: ${{ inputs.full_validation }}
      run: test "$FULL_VALIDATION" != true
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact reference attempt, required jobs and bounded source equivalence
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REFERENCE_RUN: ${{ inputs.reference_run }}
        REFERENCE_ATTEMPT: ${{ inputs.reference_attempt }}
        REFERENCE_HEAD: ${{ inputs.reference_head }}
      run: |
        set -euo pipefail
        python3 .github/scripts/sdk-host-cache.py reference \
          --repository "$GITHUB_REPOSITORY" --run "$REFERENCE_RUN" \
          --attempt "$REFERENCE_ATTEMPT" --head "$REFERENCE_HEAD" \
          --checkout "$GITHUB_WORKSPACE" --evidence "$GITHUB_WORKSPACE/ci-sdk-reference"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sdk-reference-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ci-sdk-reference/
        if-no-files-found: warn

  openwrt-sdk:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && ((inputs.full_validation && (inputs.sdk_cache_validation || 'disabled') == 'disabled' && needs.plugin-webui-full.result == 'success') || (!inputs.full_validation && (inputs.sdk_cache_validation == 'cold' || inputs.sdk_cache_validation == 'warm') && needs.reference-check.result == 'success')) }}
    needs: [plugin-webui-full, reference-check]
    permissions:
      contents: read
    env:
      HOST_CACHE_MODE: ${{ inputs.sdk_cache_validation == 'cold' && 'cold' || inputs.sdk_cache_validation == 'warm' && 'warm' || 'auto' }}
      SDK_ARCHIVE: openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_SHA256: 229e871f734a2cee5ce3ad6a3e98d3836b0899bfdeaea4d9c2c5cc7b1fce1407
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24.21.0'
    - name: Retrieve the dependency lock already tested and packaged by this run
      if: inputs.full_validation
      uses: actions/download-artifact@v4
      with:
        name: plugin-webui-${{ github.sha }}
        path: ${{ runner.temp }}/validated-webui
    - name: Use the tracked reference-equivalent lock for SDK-only
      if: ${{ !inputs.full_validation }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/validated-webui"
        cp plugin/smartdns-ui/Cargo.lock "$RUNNER_TEMP/validated-webui/Cargo.lock"
        (cd "$RUNNER_TEMP/validated-webui"; sha256sum Cargo.lock > Cargo.lock.sha256)

    - name: Prepare ordinary SDK dependencies
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev flex bison gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd cmake ninja-build libelf-dev liblzma-dev
        mkdir -p ci-sdk "$RUNNER_TEMP/smartdns-sdk"
        git rev-parse HEAD > ci-sdk/recipe-commit.txt
    - name: Mark official archive restore start
      run: date +%s > ci-sdk/sdk-archive-restore-start.txt

    - name: Restore only the fixed official SDK archive
      id: sdk_tar
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/${{ env.SDK_ARCHIVE }}
        key: smartdns-sdk-archive-v1-${{ env.SDK_SHA256 }}

    - name: Verify official archive bytes and extract fresh SDK
      id: sdk_tar_verify
      run: |
        set -euo pipefail
        start=$(date +%s)
        printf '%s\n' "$start" > ci-sdk/sdk-archive-restore-end.txt
        archive="$RUNNER_TEMP/$SDK_ARCHIVE"
        downloaded=false
        if ! printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum -c -; then
          # An immutable bad cache entry is not repaired by this download.
          rm -f "$archive"
          curl --fail --location --retry 3 "https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/$SDK_ARCHIVE" -o "$archive"
          downloaded=true
        fi
        printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum -c - | tee ci-sdk/sdk-hash.txt
        tar --zstd -xf "$archive" -C "$RUNNER_TEMP/smartdns-sdk" --strip-components=1
        echo "downloaded=$downloaded" >> "$GITHUB_OUTPUT"
        printf 'start=%s\nend=%s\ndownloaded=%s\n' "$start" "$(date +%s)" "$downloaded" > ci-sdk/sdk-archive-timing.txt

    - name: Mark official archive save start
      if: steps.sdk_tar_verify.outputs.downloaded == 'true'
      run: date +%s > ci-sdk/sdk-archive-save-start.txt

    - name: Save verified official SDK archive only
      id: sdk_tar_save
      if: steps.sdk_tar_verify.outputs.downloaded == 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/${{ env.SDK_ARCHIVE }}
        key: smartdns-sdk-archive-v1-${{ env.SDK_SHA256 }}

    - name: Record official archive save observation
      if: always()
      run: |
        mkdir -p ci-sdk
        date +%s > ci-sdk/sdk-archive-save-observed-end.txt
        if test -f "$RUNNER_TEMP/$SDK_ARCHIVE"; then
          stat -c '%s' "$RUNNER_TEMP/$SDK_ARCHIVE" > ci-sdk/sdk-archive-bytes.txt
        fi

    - name: Run bounded host-cache contracts against the verified SDK rules
      run: |
        set -euo pipefail
        timeout -k 10 180 python3 .github/scripts/test-sdk-host-cache.py \
          --sdk-source-dir "$RUNNER_TEMP/smartdns-sdk" \
          --helper "$GITHUB_WORKSPACE/.github/scripts/sdk-host-cache.py" -v \
          2>&1 | tee ci-sdk/cache-contracts.log

    - name: Pin feeds, install candidate recipe and validate reachable source identity
      run: |
        set -euo pipefail
        recipe="$GITHUB_WORKSPACE/package/openwrt/Makefile"
        source=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$recipe")
        hash=$(sed -n 's/^PKG_HASH:=//p' "$recipe")
        [[ "$source" =~ ^[0-9a-f]{40}$ && "$hash" =~ ^[0-9a-f]{64}$ ]]
        grep -Fx 'PKG_SOURCE_URL:=https://codeload.github.com/polaris-arch/smartdns/tar.gz' "$recipe"
        git merge-base --is-ancestor "$source" HEAD
        # All source, including CI and build helpers, must match the archive.
        # Only the recipe's real source/archive pin may differ.
        # recipe-commit.txt records CI HEAD; core-commit.txt records SDK source.
        test -z "$(git diff --name-only "$source" HEAD -- . ':!package/openwrt/Makefile')"
        printf '%s\n' "$source" > ci-sdk/core-commit.txt
        cp "$recipe" ci-sdk/Makefile
        cd "$RUNNER_TEMP/smartdns-sdk"
        printf '%s\n' \
          'src-git-full base https://github.com/openwrt/openwrt.git^78b23a26c4c98938d549e7ff5876508544e33d4d' \
          'src-git packages https://github.com/openwrt/packages.git^f1470815f41fe199bfdafe9a91ad115bc2e91203' > feeds.conf
        ./scripts/feeds update -a 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/feeds-update.log"
        test "$(git -C feeds/base rev-parse HEAD)" = 78b23a26c4c98938d549e7ff5876508544e33d4d
        test "$(git -C feeds/packages rev-parse HEAD)" = f1470815f41fe199bfdafe9a91ad115bc2e91203
        # Do not apply unrelated feed patches to the pinned candidate source.
        rm -rf feeds/packages/net/smartdns
        mkdir -p feeds/packages/net/smartdns
        cp "$recipe" feeds/packages/net/smartdns/Makefile
        ./scripts/feeds install -a 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/feeds-install.log"
        printf '%s\n' 'CONFIG_ALL=n' 'CONFIG_ALL_NONSHARED=n' 'CONFIG_ALL_KMODS=n' 'CONFIG_PACKAGE_smartdns=m' 'CONFIG_PACKAGE_smartdns-ui=m' > .config
        make defconfig
        grep -Fx 'CONFIG_PACKAGE_smartdns=m' .config
        grep -Fx 'CONFIG_PACKAGE_smartdns-ui=m' .config
        grep -Fx 'CONFIG_x86_64=y' .config
        grep -Fx 'CONFIG_USE_MUSL=y' .config
        test "$(uname -m)" = x86_64
        # Rust 1.89 forbids download-ci-llvm=true on CI, and if-unchanged
        # requires Git sources, not this feed's verified release tarball.
        # Build LLVM honestly; bound resources to this existing x86-only job.
        python3 - <<'PY'
        import difflib, hashlib, os, pathlib
        path = pathlib.Path('feeds/packages/lang/rust/Makefile')
        before = path.read_bytes()
        assert hashlib.sha256(before).hexdigest() == '6bccd582a3bfc665f14e29ea89dd2b134221a2dca78c08313a0a6b4e23056d75'
        old = b'--set=llvm.download-ci-llvm=true'
        assert before.count(old) == 1
        new = b'--set=llvm.download-ci-llvm=false --set=build.jobs=2 --set=llvm.link-jobs=1 --set=llvm.targets=X86 --set=llvm.experimental-targets='
        after = before.replace(old, new)
        evidence = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'ci-sdk'
        (evidence / 'rust-feed.before').write_bytes(before)
        (evidence / 'rust-feed.after').write_bytes(after)
        (evidence / 'rust-feed.diff').write_text(''.join(difflib.unified_diff(before.decode().splitlines(True), after.decode().splitlines(True), fromfile='pinned/rust/Makefile', tofile='ci/rust/Makefile')))
        (evidence / 'rust-feed.sha256').write_text(''.join(hashlib.sha256(data).hexdigest() + '  ' + name + '\n' for name, data in [('rust-feed.before', before), ('rust-feed.after', after)]))
        path.write_bytes(after)
        PY
        cp .config "$GITHUB_WORKSPACE/ci-sdk/sdk.config"
        cp feeds.conf "$GITHUB_WORKSPACE/ci-sdk/"
        cp include/package.mk "$GITHUB_WORKSPACE/ci-sdk/sdk-package.mk"
        cp rules.mk "$GITHUB_WORKSPACE/ci-sdk/sdk-rules.mk"
    - name: Download current source and validate complete archive identity
      run: |
        set -euo pipefail
        (cd "$RUNNER_TEMP/validated-webui"; sha256sum -c Cargo.lock.sha256)
        cmp "$GITHUB_WORKSPACE/plugin/smartdns-ui/Cargo.lock" "$RUNNER_TEMP/validated-webui/Cargo.lock"
        cd "$RUNNER_TEMP/smartdns-sdk"
        make package/feeds/packages/smartdns/download V=sc -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/download.log"
        source=$(cat "$GITHUB_WORKSPACE/ci-sdk/core-commit.txt")
        hash=$(sed -n 's/^PKG_HASH:=//p' feeds/packages/net/smartdns/Makefile)
        printf '%s  %s\n' "$hash" "dl/smartdns-$source.tar.gz" | sha256sum -c - | tee "$GITHUB_WORKSPACE/ci-sdk/core-hash.txt"
        tar -tzf "dl/smartdns-$source.tar.gz" > "$GITHUB_WORKSPACE/ci-sdk/source-inventory.txt"
        grep -Fx "smartdns-$source/package/webui/prepare-source.sh" "$GITHUB_WORKSPACE/ci-sdk/source-inventory.txt"
        grep -Fx "smartdns-$source/plugin/smartdns-ui/Cargo.lock" "$GITHUB_WORKSPACE/ci-sdk/source-inventory.txt"
        python3 "$GITHUB_WORKSPACE/.github/scripts/sdk-host-cache.py" source \
          --checkout "$GITHUB_WORKSPACE" --archive "$PWD/dl/smartdns-$source.tar.gz" \
          --source "$source" --archive-sha256 "$hash" \
          --lock "$RUNNER_TEMP/validated-webui/Cargo.lock" --evidence "$GITHUB_WORKSPACE/ci-sdk"

    - name: Compute exact host input key before any cached configuration
      id: host_inputs
      run: |
        set -euo pipefail
        python3 .github/scripts/sdk-host-cache.py inputs \
          --sdk-root "$RUNNER_TEMP/smartdns-sdk" --evidence "$GITHUB_WORKSPACE/ci-sdk" \
          --github-output "$GITHUB_OUTPUT"
        date +%s > ci-sdk/host-restore-start.txt

    - name: Restore quarantined host capsule by exact key only
      id: host_cache
      if: env.HOST_CACHE_MODE != 'cold'
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/sdk-host-capsule
        key: ${{ steps.host_inputs.outputs.cache_key }}

    - name: Validate exact hit and safely restore or select one cold fallback
      id: host_restore
      env:
        CACHE_HIT: ${{ steps.host_cache.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.host_cache.outputs.cache-matched-key }}
        REQUESTED_KEY: ${{ steps.host_inputs.outputs.cache_key }}
      run: |
        set -euo pipefail
        python3 .github/scripts/sdk-host-cache.py restore \
          --sdk-root "$RUNNER_TEMP/smartdns-sdk" --evidence "$GITHUB_WORKSPACE/ci-sdk" \
          --capsule-dir "$RUNNER_TEMP/sdk-host-capsule" --mode "$HOST_CACHE_MODE" \
          --cache-hit "$CACHE_HIT" --matched-key "$MATCHED_KEY" --key "$REQUESTED_KEY" \
          --github-output "$GITHUB_OUTPUT"
        date +%s > ci-sdk/host-restore-end.txt

    - name: Configure cold host and capture genuine pre-AUTOREMOVE provenance
      if: steps.host_restore.outputs.origin == 'cold'
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/smartdns-sdk"
        make package/feeds/packages/rust/host/configure V=sc -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/rust-host-configure.log"
        cp build_dir/target-x86_64_musl/host/rustc-1.89.0-src/bootstrap.toml "$GITHUB_WORKSPACE/ci-sdk/rust-bootstrap.toml"
        python3 - <<'PY'
        import os, pathlib, tomllib
        assert os.environ.get('CI') == 'true' and os.environ.get('GITHUB_ACTIONS') == 'true'
        config = tomllib.loads((pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'ci-sdk/rust-bootstrap.toml').read_text())
        assert config['build']['build'] == 'x86_64-unknown-linux-gnu'
        assert config['build']['host'] == ['x86_64-unknown-linux-gnu']
        assert set(config['build']['target']) == {'x86_64-unknown-linux-gnu', 'x86_64-unknown-linux-musl'}
        assert config['build']['jobs'] == 2
        assert config['llvm']['download-ci-llvm'] is False
        assert config['llvm']['link-jobs'] == 1
        assert config['llvm']['targets'] == 'X86' and config['llvm']['experimental-targets'] == ''
        PY
        python3 "$GITHUB_WORKSPACE/.github/scripts/sdk-host-cache.py" capture \
          --sdk-root "$PWD" --evidence "$GITHUB_WORKSPACE/ci-sdk"

    - name: Execute official host compile and installation entrypoint
      env:
        HOST_ORIGIN: ${{ steps.host_restore.outputs.origin }}
      run: |
        set -euo pipefail
        [[ "$HOST_ORIGIN" == cold || "$HOST_ORIGIN" == cache ]]
        date +%s > ci-sdk/host-compile-start.txt
        cd "$RUNNER_TEMP/smartdns-sdk"
        make package/feeds/packages/rust/host/compile V=sc -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/rust-host-compile.log"
        # The pinned feed installs to target staging/host, not hostpkg/bin.
        sdk_rustc="$PWD/staging_dir/target-x86_64_musl/host/bin/rustc"
        "$sdk_rustc" -vV | tee "$GITHUB_WORKSPACE/ci-sdk/rustc.txt"
        test "$("$sdk_rustc" --version | awk '{print $2}')" = 1.89.0
        "$sdk_rustc" --print sysroot | tee "$GITHUB_WORKSPACE/ci-sdk/rust-sysroot.txt"
        sha256sum "$sdk_rustc" > "$GITHUB_WORKSPACE/ci-sdk/rustc.sha256"
        sdk_cargo="$PWD/staging_dir/target-x86_64_musl/host/bin/cargo"
        "$sdk_cargo" -vV | tee "$GITHUB_WORKSPACE/ci-sdk/cargo.txt"
        sha256sum "$sdk_cargo" > "$GITHUB_WORKSPACE/ci-sdk/cargo.sha256"
        python3 "$GITHUB_WORKSPACE/.github/scripts/sdk-host-cache.py" probe \
          --sdk-root "$PWD" --evidence "$GITHUB_WORKSPACE/ci-sdk" --origin "$HOST_ORIGIN"
        date +%s > "$GITHUB_WORKSPACE/ci-sdk/host-compile-end.txt"

    - name: Snapshot only the verified installed cold host closure
      id: host_snapshot
      if: steps.host_restore.outputs.origin == 'cold'
      run: |
        set -euo pipefail
        python3 .github/scripts/sdk-host-cache.py snapshot \
          --sdk-root "$RUNNER_TEMP/smartdns-sdk" --evidence "$GITHUB_WORKSPACE/ci-sdk" \
          --capsule-dir "$RUNNER_TEMP/sdk-host-capsule" --github-output "$GITHUB_OUTPUT"

    - name: Mark host save attempt before application compilation
      if: steps.host_snapshot.outputs.save_ready == 'true'
      run: date +%s > ci-sdk/host-save-start.txt

    - name: Save completed host independently of later application result
      id: host_save
      if: steps.host_snapshot.outputs.save_ready == 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/sdk-host-capsule
        key: ${{ steps.host_inputs.outputs.cache_key }}

    - name: Record cache action outcomes without claiming persistence
      if: always()
      env:
        TAR_RESTORE_OUTCOME: ${{ steps.sdk_tar.outcome }}
        TAR_HIT: ${{ steps.sdk_tar.outputs.cache-hit }}
        TAR_MATCHED_KEY: ${{ steps.sdk_tar.outputs.cache-matched-key }}
        TAR_SAVE_OUTCOME: ${{ steps.sdk_tar_save.outcome }}
        HOST_RESTORE_OUTCOME: ${{ steps.host_cache.outcome }}
        HOST_HIT: ${{ steps.host_cache.outputs.cache-hit }}
        HOST_MATCHED_KEY: ${{ steps.host_cache.outputs.cache-matched-key }}
        HOST_REQUESTED_KEY: ${{ steps.host_inputs.outputs.cache_key }}
        HOST_ORIGIN: ${{ steps.host_restore.outputs.origin }}
        HOST_SAVE_READY: ${{ steps.host_snapshot.outputs.save_ready }}
        HOST_SAVE_OUTCOME: ${{ steps.host_save.outcome }}
      run: |
        mkdir -p ci-sdk
        date +%s > ci-sdk/host-save-observed-end.txt
        python3 - <<'PYOUTCOME'
        import json, os, pathlib
        names = ['TAR_RESTORE_OUTCOME', 'TAR_HIT', 'TAR_MATCHED_KEY', 'TAR_SAVE_OUTCOME',
                 'HOST_RESTORE_OUTCOME', 'HOST_HIT', 'HOST_MATCHED_KEY', 'HOST_REQUESTED_KEY',
                 'HOST_ORIGIN', 'HOST_SAVE_READY', 'HOST_SAVE_OUTCOME']
        report = {name.lower(): os.environ.get(name, '') for name in names}
        report.update(persistence='unproven-until-later-exact-restore',
                      save_log='See original actions/cache/save step logs for compression, upload, warning or immutable-key collision; outcome alone is not proof.',
                      quota='unknown; no quota API query or mutation performed')
        pathlib.Path('ci-sdk/cache-action-outcomes.json').write_text(json.dumps(report, indent=2) + '\n')
        PYOUTCOME

    - name: Fresh current application preparation, actual compilation and both IPKs
      env:
        HOST_ORIGIN: ${{ steps.host_restore.outputs.origin }}
      run: |
        set -euo pipefail
        date +%s > ci-sdk/application-start.txt
        cd "$RUNNER_TEMP/smartdns-sdk"
        source=$(cat "$GITHUB_WORKSPACE/ci-sdk/core-commit.txt")
        make package/feeds/packages/smartdns/prepare V=sc -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/prepare.log"
        (cd "$RUNNER_TEMP/validated-webui"; sha256sum -c Cargo.lock.sha256)
        mapfile -t plugin_dirs < <(find build_dir -type d -path "*/smartdns-$source/plugin/smartdns-ui")
        test "${#plugin_dirs[@]}" -eq 1
        plugin_dir=${plugin_dirs[0]}
        # The archive must contain the exact source lock already validated.
        # Do not repair a missing or divergent archive by injecting CI bytes.
        cmp "$GITHUB_WORKSPACE/plugin/smartdns-ui/Cargo.lock" "$RUNNER_TEMP/validated-webui/Cargo.lock"
        cmp "$RUNNER_TEMP/validated-webui/Cargo.lock" "$plugin_dir/Cargo.lock"
        cp "$RUNNER_TEMP/validated-webui/"Cargo.lock* "$GITHUB_WORKSPACE/ci-sdk/"
        (cd "$plugin_dir"; sha256sum -c "$GITHUB_WORKSPACE/ci-sdk/Cargo.lock.sha256")
        compile_status=0
        CARGO_BUILD_ARGS=--locked make package/feeds/packages/smartdns/compile V=sc -j2 2>&1 | tee "$GITHUB_WORKSPACE/ci-sdk/compile.log" || compile_status=$?
        printf '%s\n' "$compile_status" > "$GITHUB_WORKSPACE/ci-sdk/compile-status.txt"
        # A successful SDK compile may auto-remove its source directory. Save
        # the actual surviving state, never label the earlier copy a final lock.
        if test -f "$plugin_dir/Cargo.lock"; then
          cp "$plugin_dir/Cargo.lock" "$GITHUB_WORKSPACE/ci-sdk/Cargo.lock.after-compile"
          sha256sum "$plugin_dir/Cargo.lock" > "$GITHUB_WORKSPACE/ci-sdk/lock-after-state.txt"
        else
          printf 'absent-after-compile\n' > "$GITHUB_WORKSPACE/ci-sdk/lock-after-state.txt"
        fi
        test "$compile_status" -eq 0 || exit "$compile_status"
        python3 - <<'PYSDKLOCK'
        import hashlib, os, pathlib, re
        evidence = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'ci-sdk'
        expected = hashlib.sha256((evidence / 'Cargo.lock').read_bytes()).hexdigest()
        log = (evidence / 'compile.log').read_text()
        # These are emitted inside the actual recipe around plugin make, before
        # package.mk's normal cleanup. Both complete lines are mandatory.
        positions = []
        for stage in ('BEFORE', 'AFTER'):
            matches = list(re.finditer(r'^SMARTDNS_SDK_LOCK_' + stage + r'=(.*)$', log, re.M))
            assert len(matches) == 1 and matches[0].group(1) == expected, stage
            positions.append(matches[0].start())
        assert positions[0] < positions[1]
        (evidence / 'lock-consumption.txt').write_text(expected + ' before-and-after-actual-plugin-make\n')
        PYSDKLOCK
        sha256sum -c "$GITHUB_WORKSPACE/ci-sdk/cargo.sha256"
        sha256sum -c "$GITHUB_WORKSPACE/ci-sdk/rustc.sha256"
        mkdir -p "$GITHUB_WORKSPACE/ci-sdk/ipk"
        find bin/packages -type f \( -name 'smartdns_*.ipk' -o -name 'smartdns-ui_*.ipk' \) -exec cp '{}' "$GITHUB_WORKSPACE/ci-sdk/ipk/" \;
        cd "$GITHUB_WORKSPACE/ci-sdk/ipk"
        test "$(find . -name 'smartdns_*.ipk' | wc -l)" -eq 1
        test "$(find . -name 'smartdns-ui_*.ipk' | wc -l)" -eq 1
        sha256sum *.ipk > ../packages.sha256
        for pkg in *.ipk; do tar -xzOf "$pkg" ./data.tar.gz | tar -tzf - > "../$pkg.inventory"; done
        grep -F './usr/sbin/smartdns' ../smartdns_*.inventory
        grep -F './usr/lib/smartdns_ui.so' ../smartdns-ui_*.inventory
        grep -F './usr/share/smartdns/wwwroot/dashboard/upstream-servers.html' ../smartdns-ui_*.inventory
        python3 "$GITHUB_WORKSPACE/.github/scripts/sdk-host-cache.py" probe \
          --sdk-root "$RUNNER_TEMP/smartdns-sdk" --evidence "$GITHUB_WORKSPACE/ci-sdk" --origin "$HOST_ORIGIN"
        date +%s > "$GITHUB_WORKSPACE/ci-sdk/application-end.txt"

    - name: Require a complete cold capsule for dedicated cache validation
      if: inputs.sdk_cache_validation == 'cold'
      env:
        SAVE_READY: ${{ steps.host_snapshot.outputs.save_ready }}
      run: |
        test "$SAVE_READY" = true
        # cache/save may report success after a warning. Only the subsequent
        # dedicated exact-warm run can prove that these bytes were persisted.

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openwrt-sdk-${{ github.sha }}
        path: ci-sdk/
        if-no-files-found: error
