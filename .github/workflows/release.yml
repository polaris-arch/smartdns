name: Build and Release Artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_TARGET: ${{ inputs.target || 'all' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Validate and build only; never modify tags or Releases'
        type: boolean
        default: false
      target:
        description: 'Release architectures'
        type: choice
        options: [x86_64, all]
        default: all
      release_tag:
        description: 'Existing upstream-style tag plus -polaris at this commit; empty refreshes nightly (display name nightly-polaris)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: smartdns-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/c-cpp.yml
    with:
      release_validation: true

  check_updates:
    permissions:
      contents: read
    name: Check for updates (Schedule only)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Make decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Fetch the nightly tag from origin
            git fetch origin refs/tags/nightly:refs/tags/nightly || true
            if git rev-parse refs/tags/nightly >/dev/null 2>&1; then
              NIGHTLY_SHA=$(git rev-parse refs/tags/nightly)
              CURRENT_SHA=$(git rev-parse HEAD)
              if [ "$NIGHTLY_SHA" = "$CURRENT_SHA" ]; then
                echo "Current commit ($CURRENT_SHA) is the same as the existing nightly tag. Skipping scheduled build."
                echo "should_run=false" >> $GITHUB_OUTPUT
              else
                echo "New commits detected since the last nightly tag. Running scheduled build."
                echo "should_run=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "No existing nightly tag found. Running build."
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Not a scheduled run (event: ${{ github.event_name }}). Running build."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build-release:
    name: Build Cross-Compiled Artifacts
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
      artifact_digest: ${{ steps.assets.outputs.artifact-digest }}
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
      manifest_sha: ${{ steps.receipt.outputs.manifest_sha }}
      source: ${{ steps.identity.outputs.source }}
      tree: ${{ steps.identity.outputs.tree }}
      attempt: ${{ steps.identity.outputs.attempt }}
      version: ${{ steps.packages.outputs.version }}
    needs: [check_updates, validate]
    if: needs.check_updates.outputs.should_run == 'true'
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify stable release identity
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          BUILD_ONLY: ${{ inputs.build_only == true }}
        run: |
          python3 .github/scripts/prepare-release-assets.py --check-tag "$RELEASE_TAG"
          if [ "$BUILD_ONLY" != true ]; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi

      # 2. Setup Node.js (needed for webui compilation)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      # 3. Setup Rust (needed for smartdns-ui compilation)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      # 4. Install Cargo Cache to speed up builds
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v3-${{ hashFiles('plugin/smartdns-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-v3-

      # 5. Install system dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev dnsperf jq wget unzip tar make gcc clang libclang-dev
          
          # Download and install Alpine's apk.static dynamically
          APK_FILE=$(wget -qO- https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/ | grep -oE 'apk-tools-static-[0-9][a-zA-Z0-9.-]*\.apk' | head -n 1)
          wget "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/$APK_FILE" -O /tmp/apk-tools-static.apk
          tar -zxf /tmp/apk-tools-static.apk -C /tmp
          sudo cp /tmp/sbin/apk.static /usr/local/bin/apk
          sudo cp /tmp/sbin/apk.static /usr/bin/apk
          sudo chmod +x /usr/local/bin/apk /usr/bin/apk
          apk --version

      # 8. Cache Musl Toolchains and OpenSSL
      - name: Cache Musl Toolchains and OpenSSL
        uses: actions/cache@v5
        id: cache-toolchain
        with:
          path: ~/toolchain
          key: ${{ runner.os }}-${{ env.BUILD_TARGET }}-toolchains-openssl-3.5.4-v2

      # 9. Link Cached Toolchains to /opt/toolchain (Runs always so paths match)
      - name: Link Cached Toolchains
        run: |
          sudo mkdir -p /opt
          sudo ln -sfn "$HOME/toolchain" /opt/toolchain

      # 10. Download and extract musl-cross toolchains
      - name: Setup Musl Cross-Compilers
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain
          
          # Robust download with retry and verification
          download_and_extract() {
            local url="$1"
            local dest_dir="$2"
            local tmp_file="/tmp/toolchain.tgz"
            local max_attempts=5
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Downloading $url (Attempt $attempt/$max_attempts)..."
              rm -f "$tmp_file"
              if wget -q --timeout=30 --tries=3 "$url" -O "$tmp_file"; then
                if gzip -t "$tmp_file" >/dev/null 2>&1; then
                  echo "Download successful and verified."
                  tar -C "$dest_dir" -xzf "$tmp_file"
                  rm -f "$tmp_file"
                  return 0
                else
                  echo "Downloaded file is corrupted/incomplete."
                fi
              fi
              echo "Attempt $attempt failed. Retrying in 5 seconds..."
              sleep 5
              attempt=$((attempt+1))
            done
            echo "Failed to download $url after $max_attempts attempts."
            return 1
          }

          declare -A toolchains=(
            ["mips"]="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mips-linux-musl-cross.tgz mips-linux-musl-cross mips-unknown-linux-musl"
            ["mipsel"]="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz mipsel-linux-musl-cross mipsel-unknown-linux-musl"
            ["arm"]="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/arm-linux-musleabi-cross.tgz arm-linux-musleabi-cross arm-unknown-linux-musleabi"
            ["aarch64"]="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/aarch64-linux-musl-cross.tgz aarch64-linux-musl-cross aarch64-unknown-linux-musl"
            ["x86_64"]="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/x86_64-linux-musl-cross.tgz x86_64-linux-musl-cross x86_64-unknown-linux-musl"
            ["i686"]="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/i686-linux-musl-cross.tgz i686-linux-musl-cross i686-unknown-linux-musl"
          )
          
          for arch in "${!toolchains[@]}"; do
            if [ "$BUILD_TARGET" != all ] && [ "$arch" != "$BUILD_TARGET" ]; then continue; fi
            read -r url dir_name target_name <<< "${toolchains[$arch]}"
            echo "==========================================="
            echo "Installing $arch toolchain..."
            echo "==========================================="
            download_and_extract "$url" "$HOME/toolchain"
            ln -s "$dir_name" "$HOME/toolchain/$target_name"
            
            # Symlink all prefix commands to their -unknown- equivalents
            prefix_from=$(echo "$dir_name" | sed 's/-cross//')
            prefix_to="$target_name"
            
            for f in "$HOME/toolchain/$dir_name/bin/$prefix_from"-*; do
              if [ -f "$f" ]; then
                base=$(basename "$f")
                new_base=$(echo "$base" | sed "s/$prefix_from/$prefix_to/")
                ln -s "$f" "$HOME/toolchain/$dir_name/bin/$new_base"
              fi
            done
            
            # Create a symlink to "objdump" so that the target's objdump is called instead of host's objdump
            ln -s "${prefix_from}-objdump" "$HOME/toolchain/$dir_name/bin/objdump"
          done

      # 11. Download and compile OpenSSL for each target
      - name: Compile OpenSSL for Cross-Compilers
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz -O /tmp/openssl-3.5.4.tar.gz
          
          build_openssl() {
            local cc_path="$1"
            local target="$2"
            echo "==========================================="
            echo "Building OpenSSL for $cc_path ($target)..."
            echo "==========================================="
            local sysroot=$($cc_path --print-sysroot)
            mkdir -p /tmp/build-openssl
            cd /tmp/build-openssl
            rm -rf openssl-3.5.4
            tar -xzf /tmp/openssl-3.5.4.tar.gz
            cd openssl-3.5.4
            
            CC="$cc_path" ./Configure "$target" \
              --prefix="$sysroot" \
              no-shared no-tests no-apps \
              no-argon2 no-aria no-async no-bf no-blake2 no-camellia no-cmp no-cms \
              no-comp no-des no-dh no-dsa no-ec2m no-engine no-gost \
              no-http no-idea no-legacy no-md4 no-mdc2 no-multiblock \
              no-nextprotoneg no-ocb no-ocsp no-rc2 no-rc4 no-rmd160 \
              no-scrypt no-seed no-siphash no-siv no-sm2 no-sm3 no-sm4 \
              no-srp no-srtp no-ts no-whirlpool no-ssl-trace no-ssl no-ssl3 -Os
              
            make -j$(nproc)
            sudo make install_sw
          }
          
          # Compile OpenSSL for each target in parallel or sequence
          for arch in mips mipsel arm aarch64 x86_64 i686; do
            if [ "$BUILD_TARGET" != all ] && [ "$arch" != "$BUILD_TARGET" ]; then continue; fi
            case "$arch" in
              mips|mipsel) ssl_target=linux-generic32 ;;
              arm) ssl_target=linux-armv4 ;;
              aarch64) ssl_target=linux-aarch64 ;;
              x86_64) ssl_target=linux-x86_64 ;;
              i686) ssl_target=linux-elf ;;
            esac
            toolchain="$arch-unknown-linux-musl"
            if [ "$arch" = arm ]; then toolchain=arm-unknown-linux-musleabi; fi
            build_openssl "/opt/toolchain/$toolchain/bin/$toolchain-gcc" "$ssl_target"
          done

      - name: Record immutable source and compiler inputs
        id: identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e plugin/smartdns-ui/target
          git ls-files --error-unmatch plugin/smartdns-ui/Cargo.lock
          mkdir -p release-evidence
          sha256sum plugin/smartdns-ui/Cargo.lock > release-evidence/lock.before
          test "$(cut -d' ' -f1 release-evidence/lock.before)" = 627d46f1a05e5d82d2f71ba47ba3aeb2f28ab1c7f2c29e42b438df5b874ccb68
          rustc -Vv | tee release-evidence/rustc.txt
          test "$(rustc --version)" = 'rustc 1.99.1 (58cf8f9c3 2026-10-13)'
          test "$(node --version)" = v24.21.0
          { command -v rustc cargo node clang; rustc --print sysroot; cargo -V; node -v; clang --version; } > release-evidence/toolchains.txt
          git describe --tags --always --dirty > release-evidence/git-describe.txt
          sha256sum package/webui/source.conf package/webui/*.patch > release-evidence/frontend-inputs.sha256
          cp package/webui/source.conf release-evidence/
          grep -E '^PKG_(SOURCE_VERSION|HASH):=' package/openwrt/Makefile > release-evidence/openwrt-source.txt
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Record remote state before read-only build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PYREMOTE'
          import importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location('assets', '.github/scripts/prepare-release-assets.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          base = mod.repo_endpoint(os.environ['GITHUB_REPOSITORY'])
          latest = mod.gh_api(base + '/releases/latest', missing_ok=True)
          tags = sorted({'nightly', os.environ.get('RELEASE_TAG', ''), (latest or {}).get('tag_name', '')} - {''})
          state = {tag: {kind: mod.gh_api(base + endpoint + tag, missing_ok=True)
                   for kind, endpoint in [('ref', '/git/ref/tags/'), ('release', '/releases/tags/')]}
                   for tag in tags}
          # Downloads by users are not a tag/Release mutation.
          for item in state.values():
              for asset in (item['release'] or {}).get('assets', []):
                  asset.pop('download_count', None)
          pathlib.Path('release-evidence/remote.before.json').write_text(json.dumps(state, sort_keys=True, indent=2) + '\n')
          PYREMOTE

      # 9. Run the build script
      - name: Build All Targets
        id: packages
        run: |
          # 1. Determine release version
          export RELEASE_VERSION="$(date +"1.%Y.%m.%d-%H%M")"
          
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_VERSION" > release-evidence/package-version.txt
          echo "Building Version: ${RELEASE_VERSION}"
          
          # 2. Write build-static.sh on-the-fly (not committed to repo)
          cat << 'EOF' > build-static.sh
          #!/bin/bash
          set -euo pipefail

          ORIG_PATH="$PATH"
          CURR_DIR=$(cd $(dirname $0);pwd)
          VER="${RELEASE_VERSION:-$(date +"1.%Y.%m.%d-%H%M")}"
          CODE_DIR=$(pwd)

          build()
          {
              local BUILD_OPT=""
              BUILD_OPT="$BUILD_OPT --platform $2" 
              BUILD_OPT="$BUILD_OPT --arch all" 
              BUILD_OPT="$BUILD_OPT --filearch=$1-$2-all " 
              BUILD_OPT="$BUILD_OPT --ver $VER" 
              BUILD_OPT="$BUILD_OPT --outputdir $CURR_DIR" 
              if [ ! -z "${CORSS_TOOL:-}" ]; then
                  BUILD_OPT="$BUILD_OPT --cross-tool $CORSS_TOOL"
              fi
              if [ "${3:-}" = "nobuild" ]; then
                  BUILD_OPT="$BUILD_OPT --only-package"
              fi
              if [ "${4:-}" = "ui" ]; then
                  BUILD_OPT="$BUILD_OPT --with-ui"
              fi

              chmod +x $CODE_DIR/package/build-pkg.sh

              # Prepend target's toolchain bin directory to PATH so correct gcc/strip/objdump are used
              export PATH="$ORIG_PATH"
              if [ -n "${CC:-}" ]; then
                  local TC_BIN_DIR=$(dirname "${CC:-}")
                  export PATH="$TC_BIN_DIR:$PATH"
              fi

              if [ "${4:-}" = ui ] && [ "${3:-}" != nobuild ]; then
                  # Environment-origin CC is essential: reuse the helper's mapping.
                  local rust_target
                  rust_target=$(CC="$CC" make -s --no-print-directory -C "$CODE_DIR/plugin/smartdns-ui" OPTIMIZE_SIZE=1 print-rust-target)
                  test -n "$rust_target"
                  rustup target add --toolchain 1.99.1 "$rust_target"
                  rustup target list --toolchain 1.99.1 --installed | grep -Fx "$rust_target"
                  test -d "$(rustc --print target-libdir --target "$rust_target")"
                  rm -f "$CODE_DIR/plugin/smartdns-ui/target/smartdns_ui.so"
                  { echo "target=$rust_target"; echo 'profile=release-optmize-size'; echo "CC=$CC"; "$CC" --version; "$CC" -dumpmachine; "$CC" --print-sysroot; } > "$CURR_DIR/release-evidence/$1-toolchain.txt"
              fi

              $CODE_DIR/package/build-pkg.sh  $BUILD_OPT || { echo "build-pkg.sh failed for $1 $2"; exit 1; }
              if [ "${4:-}" = ui ]; then
                  local plugin="$CODE_DIR/plugin/smartdns-ui/target/smartdns_ui.so"
                  test -s "$plugin"
                  if [ "${3:-}" != nobuild ]; then
                      sha256sum "$plugin" | cut -d' ' -f1 > "$CURR_DIR/release-evidence/$1-plugin.sha256"
                      "${CC%-gcc}-readelf" -h -d "$plugin" > "$CURR_DIR/release-evidence/$1-plugin.elf.txt"
                      strings "$plugin" | grep -F "$(cat "$CURR_DIR/release-evidence/git-describe.txt")" > "$CURR_DIR/release-evidence/$1-plugin.version.txt"
                  fi
                  test "$(sha256sum "$plugin" | cut -d' ' -f1)" = "$(cat "$CURR_DIR/release-evidence/$1-plugin.sha256")"
                  # Every UI architecture ends with a generic archive: verify the actual packaged plugin.
                  if [ "$2" = linux ]; then
                      tar -xOf "$CURR_DIR/smartdns.$VER.$1-linux-all.tar.gz" smartdns/usr/local/lib/smartdns/smartdns_ui.so | sha256sum | cut -d' ' -f1 > "$CURR_DIR/release-evidence/$1-packaged-plugin.sha256"
                      cmp "$CURR_DIR/release-evidence/$1-plugin.sha256" "$CURR_DIR/release-evidence/$1-packaged-plugin.sha256"
                  fi
              fi
              if [ "${3:-}" != "nobuild" ] && [ "${4:-}" = "" ]; then
                  cp $CODE_DIR/src/smartdns $CURR_DIR/smartdns-$1 || { echo "Failed to copy smartdns binary"; exit 1; }
              fi
          }

          clean() 
          {
              make -C $CODE_DIR clean || true
          }

          rm -f $CURR_DIR/smartdns.*
          rm -f $CURR_DIR/*.ipk
          rm -f $CURR_DIR/*.apk
          rm -f $CURR_DIR/*.deb
          rm -f $CURR_DIR/smartdns-*

          unset CC

          export STATIC=yes
          export CFLAGS="-DFEATURE_CHECK_EDNS -O2 -g -Wall -Wstrict-prototypes -fno-omit-frame-pointer -Wstrict-aliasing -funwind-tables -Wmissing-prototypes -Wshadow -Wextra -Wno-unused-parameter -Wno-implicit-fallthrough"

          if [ "$BUILD_TARGET" = all ]; then
          build all luci nobuild
          build all luci-lite nobuild
          build all luci-compat nobuild

          # mips
          export CC=/opt/toolchain/mips-unknown-linux-musl/bin/mips-unknown-linux-musl-gcc
          build mips optware
          build mips openwrt nobuild
          build mips debian nobuild
          clean
          unset CC

          # mipsel
          export CC=/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc
          build mipsel optware
          build mipsel openwrt nobuild
          build mipsel debian nobuild
          clean
          unset CC

          # arm
          export CC=/opt/toolchain/arm-unknown-linux-musleabi/bin/arm-unknown-linux-musleabi-gcc
          build arm optware 
          build arm optware "" ui
          build arm openwrt nobuild ui
          build arm debian nobuild ui
          build arm linux nobuild ui
          unset CC

          # aarch64
          export CC=/opt/toolchain/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc
          build aarch64 optware 
          build aarch64 optware "" ui
          build aarch64 openwrt nobuild ui 
          build aarch64 debian nobuild ui
          build aarch64 linux nobuild ui
          clean
          unset CC

          # x86-64
          fi
          export CC=/opt/toolchain/x86_64-unknown-linux-musl/bin/x86_64-unknown-linux-musl-gcc
          build x86_64 optware 
          build x86_64 openwrt "" ui
          build x86_64 debian nobuild ui
          build x86_64 linux nobuild ui
          clean

          # x86
          if [ "$BUILD_TARGET" = all ]; then
          export CC=/opt/toolchain/i686-unknown-linux-musl/bin/i686-unknown-linux-musl-gcc
          build x86 optware 
          build x86 openwrt "" ui
          build x86 debian nobuild ui
          build x86 linux nobuild ui
          clean
          fi

          make -C $CODE_DIR/src clean || true
          EOF

          chmod +x build-static.sh
          ./build-static.sh
          sha256sum -c release-evidence/lock.before
          sha256sum plugin/smartdns-ui/Cargo.lock > release-evidence/lock.after
          cmp release-evidence/lock.before release-evidence/lock.after
          sha256sum package/target/smartdns-webui/package-lock.json > release-evidence/frontend-locks.sha256
          sha256sum package/target/smartdns-webui-*.tar.gz > release-evidence/frontend-archives.sha256

          echo "=== List of all files generated in workspace ==="
          ls -la
          echo "================================================="

          # 3. Gather all built release assets into a single clean directory
          echo "==========================================="
          echo "Gathering release assets..."
          echo "==========================================="
          mkdir -p release-assets
          
          # Move Luci / APK / IPK all-architecture plugins and all compiled binaries/packages
          mv luci-app-smartdns* release-assets/ 2>/dev/null || true
          mv smartdns-* release-assets/ 2>/dev/null || true
          mv *.ipk release-assets/ 2>/dev/null || true
          mv *.apk release-assets/ 2>/dev/null || true
          mv *.deb release-assets/ 2>/dev/null || true
          mv *.tar.gz release-assets/ 2>/dev/null || true

          # Enforce the upstream asset set, then suffix only public filenames.
          # Package bytes, metadata, versions and installed paths are unchanged.
          python3 .github/scripts/prepare-release-assets.py \
            --directory release-assets --version "$RELEASE_VERSION" --target "$BUILD_TARGET"
          
          echo "=== List of all files in release-assets ==="
          ls -la release-assets/
          echo "==========================================="

      - name: Verify packaged plugin bytes and ELF identities
        env:
          VERSION: ${{ steps.packages.outputs.version }}
        run: |
          python3 - <<'PYPACKAGES'
          import hashlib, io, json, os, pathlib, struct, subprocess, tarfile, tempfile
          evidence = pathlib.Path('release-evidence')
          # ELF class/machine are an output check, not a Rust target mapping.
          machines = {'arm': (1, 40), 'aarch64': (2, 183), 'x86_64': (2, 62), 'x86': (1, 3)}
          arches = list(machines) if os.environ['BUILD_TARGET'] == 'all' else ['x86_64']
          records = {}
          def plugin_from_tar(data):
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as tar:
                  matches = [m for m in tar.getmembers() if m.isfile() and m.name.endswith('/smartdns_ui.so')]
                  assert len(matches) == 1, 'missing/duplicate packaged plugin'
                  return tar.extractfile(matches[0]).read()
          for arch in arches:
              expected = (evidence / (arch + '-plugin.sha256')).read_text().strip()
              for p in sorted(pathlib.Path('release-assets').glob('smartdns.*.' + arch + '-*-all-polaris.*')):
                  # Original x86/x86_64 optware packages are daemon-only.
                  if arch in ('x86', 'x86_64') and '-optware-' in p.name:
                      continue
                  if p.suffix == '.ipk':
                      with tarfile.open(p, 'r:gz') as outer:
                          member, = [m for m in outer.getmembers() if m.name.lstrip('./') == 'data.tar.gz']
                          data = plugin_from_tar(outer.extractfile(member).read())
                  elif p.suffix == '.deb':
                      data = plugin_from_tar(subprocess.check_output(['dpkg-deb', '--fsys-tarfile', str(p)]))
                  elif p.suffix == '.apk':
                      with tempfile.TemporaryDirectory() as tmp:
                          subprocess.run(['apk', 'extract', '--allow-untrusted', '--destination', tmp, str(p.resolve())], check=True)
                          plugin, = pathlib.Path(tmp).rglob('smartdns_ui.so')
                          assert not plugin.is_symlink()
                          data = plugin.read_bytes()
                  else:
                      data = plugin_from_tar(p.read_bytes())
                  assert hashlib.sha256(data).hexdigest() == expected, 'packaged plugin mismatch: ' + p.name
                  assert data[:4] == b'\x7fELF' and data[5] == 1, 'expected little-endian ELF'
                  assert (data[4], struct.unpack('<H', data[18:20])[0]) == machines[arch], 'wrong ELF architecture'
                  version = (evidence / 'git-describe.txt').read_text().strip()
                  assert version.encode() in data, 'actual plugin lacks source version'
                  records[p.name] = dict(plugin_sha256=expected, elf_class=data[4], elf_machine=machines[arch][1], git_describe=version)
          expected_count = 18 if os.environ['BUILD_TARGET'] == 'all' else 4
          assert len(records) == expected_count, 'UI package evidence count mismatch'
          (evidence / 'packaged-plugins.json').write_text(json.dumps(records, sort_keys=True, indent=2) + '\n')
          PYPACKAGES

      - name: Verify remote state unchanged through read-only build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PYREMOTE'
          import importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location('assets', '.github/scripts/prepare-release-assets.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          base = mod.repo_endpoint(os.environ['GITHUB_REPOSITORY'])
          latest = mod.gh_api(base + '/releases/latest', missing_ok=True)
          tags = sorted({'nightly', os.environ.get('RELEASE_TAG', ''), (latest or {}).get('tag_name', '')} - {''})
          state = {tag: {kind: mod.gh_api(base + endpoint + tag, missing_ok=True)
                   for kind, endpoint in [('ref', '/git/ref/tags/'), ('release', '/releases/tags/')]}
                   for tag in tags}
          # Downloads by users are not a tag/Release mutation.
          for item in state.values():
              for asset in (item['release'] or {}).get('assets', []):
                  asset.pop('download_count', None)
          pathlib.Path('release-evidence/remote.after.json').write_text(json.dumps(state, sort_keys=True, indent=2) + '\n')
          PYREMOTE
          cmp release-evidence/remote.before.json release-evidence/remote.after.json

      - name: Preserve verified release assets
        id: assets
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-polaris-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Bind successful build and immutable artifact
        id: receipt
        env:
          ASSET_ID: ${{ steps.assets.outputs.artifact-id }}
          ASSET_DIGEST: ${{ steps.assets.outputs.artifact-digest }}
          VERSION: ${{ steps.packages.outputs.version }}
        run: |
          python3 - <<'PYRECEIPT'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('.')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def files(directory):
              return {p.name: {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'size': p.stat().st_size}
                      for p in sorted(directory.iterdir()) if p.is_file() and not p.is_symlink()}
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['ASSET_ID'])
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['ASSET_DIGEST'])
          receipt = dict(source=git('rev-parse', 'HEAD'), tree=git('rev-parse', 'HEAD^{tree}'),
                         run=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         repository=os.environ['GITHUB_REPOSITORY'], version=os.environ['VERSION'],
                         target=os.environ['BUILD_TARGET'], artifact_id=os.environ['ASSET_ID'],
                         artifact_digest=os.environ['ASSET_DIGEST'],
                         lock=hashlib.sha256(pathlib.Path('plugin/smartdns-ui/Cargo.lock').read_bytes()).hexdigest(),
                         assets=files(root / 'release-assets'), evidence=files(root / 'release-evidence'))
          manifest = root / 'release-evidence/manifest.json'
          manifest.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('manifest_sha=' + hashlib.sha256(manifest.read_bytes()).hexdigest() + '\n')
          PYRECEIPT

      - name: Preserve separate build evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish only the verified bytes from this build
    needs: [build-release]
    if: ${{ needs.build-release.result == 'success' && inputs.build_only != true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ASSET_ID: ${{ needs.build-release.outputs.artifact_id }}
      ASSET_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
      EVIDENCE_ID: ${{ needs.build-release.outputs.evidence_id }}
      MANIFEST_SHA: ${{ needs.build-release.outputs.manifest_sha }}
      BUILD_SOURCE: ${{ needs.build-release.outputs.source }}
      BUILD_TREE: ${{ needs.build-release.outputs.tree }}
      BUILD_ATTEMPT: ${{ needs.build-release.outputs.attempt }}
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - name: Require exact successful current-attempt identity
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ASSET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BUILD_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$BUILD_SOURCE" = "$GITHUB_SHA"
          # A publish-only rerun cannot silently reuse a previous attempt.
          # Rerun all jobs to produce and validate a fresh exact artifact instead.
          test "$BUILD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test -n "$RELEASE_VERSION"

      - name: Checkout exact built source without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release.outputs.source }}
          persist-credentials: false

      # Omitting github-token/run-id uses the current run's artifact service;
      # no actions:read token or cross-run promotion mechanism is introduced.
      - name: Download exact asset artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true

      - name: Download exact evidence artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-release.outputs.evidence_id }}
          path: release-evidence
          merge-multiple: true

      # The v4 download action only warns on transport ZIP digest mismatch.
      # Do not rely on that warning: the producing job's SHA-bound manifest
      # authenticates the exact ID/digest and fails closed on every payload byte.
      - name: Verify handoff before any publication operation
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, importlib.util, json, os, pathlib, re, subprocess
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          manifest = pathlib.Path('release-evidence/manifest.json')
          require(digest(manifest) == os.environ['MANIFEST_SHA'], 'manifest digest mismatch')
          r = json.loads(manifest.read_text())
          for key, env in [('source', 'GITHUB_SHA'), ('tree', 'BUILD_TREE'), ('run', 'GITHUB_RUN_ID'),
                           ('attempt', 'GITHUB_RUN_ATTEMPT'), ('repository', 'GITHUB_REPOSITORY'),
                           ('version', 'RELEASE_VERSION'), ('target', 'BUILD_TARGET'),
                           ('artifact_id', 'ASSET_ID'), ('artifact_digest', 'ASSET_DIGEST')]:
              require(r[key] == os.environ[env], 'handoff mismatch: ' + key)
          require(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == r['source'], 'source mismatch')
          require(subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == r['tree'], 'tree mismatch')
          require(digest(pathlib.Path('plugin/smartdns-ui/Cargo.lock')) == r['lock'], 'source lock mismatch')
          spec = importlib.util.spec_from_file_location('assets', '.github/scripts/prepare-release-assets.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          expected = {mod.distribution_name(n) for n in mod.expected_assets(r['version'], r['target'])}
          require(set(r['assets']) == expected | {'SHA256SUMS'}, 'asset allowlist mismatch')
          for directory, records in [('release-assets', r['assets']), ('release-evidence', r['evidence'])]:
              folder = pathlib.Path(directory)
              allowed = set(records) | ({'manifest.json'} if directory == 'release-evidence' else set())
              require({p.name for p in folder.iterdir()} == allowed, 'unexpected/missing files: ' + directory)
              for name, record in records.items():
                  p = folder / name
                  require(p.is_file() and not p.is_symlink() and p.stat().st_size > 0, 'invalid file: ' + name)
                  require(p.stat().st_size == record['size'] and digest(p) == record['sha256'], 'bytes mismatch: ' + name)
          sums = ''.join(r['assets'][n]['sha256'] + '  ' + n + '\n' for n in sorted(expected))
          require(pathlib.Path('release-assets/SHA256SUMS').read_text() == sums, 'checksum manifest mismatch')
          require(pathlib.Path('release-evidence/package-version.txt').read_text().strip() == r['version'], 'package version mismatch')
          arches = ['arm', 'aarch64', 'x86_64', 'x86'] if r['target'] == 'all' else ['x86_64']
          for arch in arches:
              for suffix in ['toolchain.txt', 'plugin.elf.txt', 'plugin.version.txt', 'plugin.sha256', 'packaged-plugin.sha256']:
                  require(arch + '-' + suffix in r['evidence'], 'missing target evidence: ' + arch + '-' + suffix)
          print('Verified exact artifact ID/digest binding, run/attempt/source/tree/lock/version and all asset bytes.')
          PYVERIFY

      - name: Recheck stable remote tag before publication
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/prepare-release-assets.py \
            --verify-tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      # 10. Upload all packages and binaries individually to the GitHub Release (only on release event)
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release' || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # Stable tags already exist and are verified above. GitHub compares this
          # metadata target's workflows to the default branch for token permissions.
          target_commitish: ${{ github.event.repository.default_branch }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body: |
            Polaris SmartDNS, built from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Native system/QUIC suites, ASan/UBSan and offline comparison must pass before packaging.
            Distribution filenames add -polaris before their extension; package contents and identities remain upstream-compatible.
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
          make_latest: ${{ !(github.event_name == 'release' && github.event.release.prerelease) }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. Clean up Nightly Release to prevent stale files
      - name: Clean up Nightly Release
        if: github.event_name != 'release' && inputs.release_tag == ''
        run: |
          python3 .github/scripts/prepare-release-assets.py \
            --clean-nightly --repository "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Upload all packages and binaries individually to the GitHub Nightly Release (on non-release events like schedule/workflow_dispatch)
      - name: Upload Nightly Release Assets
        uses: softprops/action-gh-release@v3
        if: github.event_name != 'release' && inputs.release_tag == ''
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "nightly-polaris"
          body: |
            This release contains the latest validated Nightly build of Polaris SmartDNS.

            - **Commit**: ${{ github.sha }}
            - **Branch**: `${{ github.ref_name }}`
            - **Build Time**: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

            These packages are automatically compiled and updated on every nightly build / manual run.
          prerelease: true
          make_latest: false
          files: release-assets/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || 'nightly' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/prepare-release-assets.py \
            --verify-tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
